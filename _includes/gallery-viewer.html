<dialog id="gallery-viewer" class="gallery-viewer" aria-labelledby="viewer-title">
  <div class="viewer-toolbar"><span id="viewer-position"></span><div><button type="button" id="viewer-zoom" aria-pressed="false">Enlarge text</button><a id="viewer-original" href="#" target="_blank" rel="noopener">Open original ↗</a><button type="button" id="viewer-close" aria-label="Close image viewer">Close ×</button></div></div>
  <div class="viewer-body"><button type="button" class="viewer-arrow" id="viewer-prev" aria-label="Previous image">←</button><div class="viewer-stage" tabindex="0" aria-label="Image area, scroll to read enlarged posters"><div class="poster-viewport" id="viewer-image-frame"><img id="viewer-image" src="{{ '/assets/images/icons/logo_home.png' | relative_url }}" alt=""></div></div><button type="button" class="viewer-arrow" id="viewer-next" aria-label="Next image">→</button></div>
  <div class="viewer-caption"><span class="eyebrow" id="viewer-category"></span><h2 id="viewer-title"></h2><p id="viewer-description"></p></div>
</dialog>
<script type="application/json" id="gallery-data">[{% for photo in site.data.gallery %}{"id":{{ photo.id | jsonify }},"title":{{ photo.title | jsonify }},"description":{{ photo.description | jsonify }},"category":{{ photo.category | jsonify }},"label":{{ photo.category_label | jsonify }},"image":{{ photo.image | relative_url | jsonify }},"width":{{ photo.width }},"visibleHeight":{{ photo.visible_height }},"offset":{{ photo.offset }}}{% unless forloop.last %},{% endunless %}{% endfor %}]</script>
